name: '🔒 Security Review - JurisLab'

on:
  pull_request:
    branches: [main, staging]
    paths:
      - 'middleware.ts'
      - 'lib/auth.ts'
      - 'lib/permissions.ts'
      - 'lib/prisma.ts'
      - 'prisma/schema.prisma'
      - 'app/api/**'
      - 'actions/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  security-review:
    name: '🔒 Automated Security Review'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for security-sensitive changes
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const files = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number
            });

            const securityFiles = files.data.filter(f => 
              f.filename.includes('auth') ||
              f.filename.includes('middleware') ||
              f.filename.includes('permission') ||
              f.filename.includes('prisma') ||
              f.filename.startsWith('app/api/')
            );

            if (securityFiles.length === 0) return;

            const warnings = [];

            for (const file of securityFiles) {
              const patch = file.patch || '';
              
              // Check for removed auth checks
              if (patch.includes('-') && (patch.includes('getServerSession') || patch.includes('enforceAdmin') || patch.includes('createScopedApiHandler'))) {
                warnings.push(`⚠️ **${file.filename}**: Possible removal of authentication check`);
              }
              
              // Check for raw SQL
              if (patch.includes('$queryRaw') || patch.includes('$executeRaw')) {
                warnings.push(`⚠️ **${file.filename}**: Raw SQL query detected - ensure proper parameterization`);
              }
              
              // Check for eval
              if (patch.includes('eval(')) {
                warnings.push(`🚨 **${file.filename}**: eval() usage detected - security risk`);
              }
              
              // Check for dangerouslySetInnerHTML
              if (patch.includes('dangerouslySetInnerHTML')) {
                warnings.push(`⚠️ **${file.filename}**: dangerouslySetInnerHTML detected - ensure XSS protection`);
              }
            }

            let comment = `## 🔒 Automated Security Review\n\n`;
            comment += `**Files with security implications**: ${securityFiles.length}\n\n`;

            if (warnings.length > 0) {
              comment += `### ⚠️ Security Warnings\n\n`;
              comment += warnings.join('\n') + '\n\n';
              comment += `> These findings require manual security review before merging.\n\n`;
            } else {
              comment += `✅ No automated security concerns detected.\n\n`;
            }

            comment += `### 📋 Security-Sensitive Files Changed\n\n`;
            securityFiles.forEach(f => {
              comment += `- \`${f.filename}\` (+${f.additions}/-${f.deletions})\n`;
            });

            comment += `\n---\n*Automated by JurisLab Security Agent*`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: comment
            });
