name: '📊 Stale Issues Management - JurisLab'

on:
  schedule:
    - cron: '0 10 * * 1'  # Every Monday at 10:00 UTC
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: '📊 Manage Stale Issues'
    runs-on: ubuntu-latest
    steps:
      - name: Check stale issues and PRs
        uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: |
            ⏰ Esta issue está inativa há 30 dias. Será fechada automaticamente em 7 dias se não houver atividade.
            
            Se esta issue ainda é relevante, por favor comente para mantê-la aberta.
          stale-pr-message: |
            ⏰ Este PR está inativo há 14 dias. Será fechado automaticamente em 7 dias se não houver atividade.
            
            Se este PR ainda é necessário, por favor atualize-o ou comente.
          close-issue-message: |
            🔒 Esta issue foi fechada por inatividade. Sinta-se livre para reabrir se necessário.
          close-pr-message: |
            🔒 Este PR foi fechado por inatividade. Sinta-se livre para reabrir se necessário.
          stale-issue-label: 'stale'
          stale-pr-label: 'stale'
          days-before-issue-stale: 30
          days-before-pr-stale: 14
          days-before-issue-close: 7
          days-before-pr-close: 7
          exempt-issue-labels: 'priority:critical,priority:high,security,pinned'
          exempt-pr-labels: 'priority:critical,priority:high,security'
          operations-per-run: 30
