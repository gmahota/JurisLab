name: '📊 CTO Dashboard - JurisLab'

on:
  schedule:
    - cron: '0 8 * * 1'     # Weekly Monday 8:00 UTC
    - cron: '0 7 1 * *'     # Monthly 1st day 7:00 UTC
    - cron: '0 9 * * *'     # Daily 9:00 UTC
  workflow_dispatch:
    inputs:
      report_type:
        description: 'Report type'
        required: true
        default: 'weekly'
        type: choice
        options:
          - daily
          - weekly
          - monthly

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  # ============================================
  # 📈 Development Velocity Metrics
  # ============================================
  velocity-metrics:
    name: '📈 Dev Velocity'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate velocity metrics
        uses: actions/github-script@v7
        with:
          script: |
            const now = new Date();
            const weekAgo = new Date(now - 7 * 24 * 60 * 60 * 1000);
            const monthAgo = new Date(now - 30 * 24 * 60 * 60 * 1000);

            // Get recent PRs
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              sort: 'updated',
              direction: 'desc',
              per_page: 100
            });

            const weeklyPRs = prs.data.filter(pr => new Date(pr.created_at) > weekAgo);
            const mergedPRs = weeklyPRs.filter(pr => pr.merged_at);
            const openPRs = prs.data.filter(pr => pr.state === 'open');

            // Get recent issues
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              sort: 'updated',
              direction: 'desc',
              per_page: 100
            });

            const weeklyIssues = issues.data.filter(i => !i.pull_request && new Date(i.created_at) > weekAgo);
            const closedIssues = weeklyIssues.filter(i => i.state === 'closed');
            const openIssues = issues.data.filter(i => !i.pull_request && i.state === 'open');

            // Calculate avg PR merge time
            let avgMergeTime = 'N/A';
            if (mergedPRs.length > 0) {
              const totalHours = mergedPRs.reduce((sum, pr) => {
                const created = new Date(pr.created_at);
                const merged = new Date(pr.merged_at);
                return sum + (merged - created) / (1000 * 60 * 60);
              }, 0);
              avgMergeTime = `${(totalHours / mergedPRs.length).toFixed(1)}h`;
            }

            // Build report
            const report = `## 📊 CTO Dashboard - JurisLab
            
**Report Date**: ${now.toISOString().split('T')[0]}
**Period**: Last 7 days

---

### 📈 Development Velocity

| Metric | Value | Trend |
|--------|-------|-------|
| PRs Created (week) | ${weeklyPRs.length} | - |
| PRs Merged (week) | ${mergedPRs.length} | - |
| Open PRs | ${openPRs.length} | - |
| Avg PR Merge Time | ${avgMergeTime} | - |
| Issues Created (week) | ${weeklyIssues.length} | - |
| Issues Closed (week) | ${closedIssues.length} | - |
| Open Issues | ${openIssues.length} | - |

### 🛡️ Security Posture
- Last security scan: Check Security workflow
- Dependency vulnerabilities: Check npm audit
- SAST findings: Check SAST workflow

### 📋 Project Health
- Active contributors this week: ${[...new Set(weeklyPRs.map(pr => pr.user.login))].length}
- Code review participation: ${mergedPRs.filter(pr => pr.requested_reviewers && pr.requested_reviewers.length > 0).length}/${mergedPRs.length} PRs reviewed

### 🎯 Business KPIs
- **Platform Uptime**: Check monitoring dashboard
- **API Response Time**: Check APM metrics
- **User Satisfaction**: Check feedback system
- **Feature Delivery Rate**: ${mergedPRs.length} features/fixes deployed

---

*Automated report generated by CTO Dashboard Agent*
*Next report: ${new Date(now.getTime() + 7 * 24 * 60 * 60 * 1000).toISOString().split('T')[0]}*`;

            core.summary.addRaw(report);
            await core.summary.write();

            // Create/update dashboard issue
            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'cto-dashboard',
              state: 'open',
              per_page: 1
            });

            if (existingIssues.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssues.data[0].number,
                body: report
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `📊 CTO Dashboard - ${now.toISOString().split('T')[0]}`,
                body: report,
                labels: ['cto-dashboard', 'automated', 'report']
              });
            }

  # ============================================
  # 📊 Technical Debt Analysis
  # ============================================
  tech-debt:
    name: '📊 Tech Debt Analysis'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Analyze technical debt
        run: |
          echo "## 📊 Technical Debt Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Count TODOs, FIXMEs, HACKs
          TODO_COUNT=$(grep -rn --include="*.ts" --include="*.tsx" "TODO\|FIXME\|HACK\|XXX" . --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=.next 2>/dev/null | wc -l || echo "0")
          echo "### Code Markers" >> $GITHUB_STEP_SUMMARY
          echo "- TODO/FIXME/HACK markers: $TODO_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Count files by type
          TS_FILES=$(find . -name "*.ts" -not -path "*/node_modules/*" -not -path "*/.next/*" 2>/dev/null | wc -l || echo "0")
          TSX_FILES=$(find . -name "*.tsx" -not -path "*/node_modules/*" -not -path "*/.next/*" 2>/dev/null | wc -l || echo "0")
          echo "### Codebase Size" >> $GITHUB_STEP_SUMMARY
          echo "- TypeScript files (.ts): $TS_FILES" >> $GITHUB_STEP_SUMMARY
          echo "- React components (.tsx): $TSX_FILES" >> $GITHUB_STEP_SUMMARY
          echo "- Total: $((TS_FILES + TSX_FILES))" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Check for legacy code
          LEGACY_FILES=$(find ./legacy -type f 2>/dev/null | wc -l || echo "0")
          echo "### Legacy Code" >> $GITHUB_STEP_SUMMARY
          echo "- Files in legacy/: $LEGACY_FILES" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Dependencies count
          DEPS=$(cat package.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d.get('dependencies',{})))" 2>/dev/null || echo "N/A")
          DEV_DEPS=$(cat package.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d.get('devDependencies',{})))" 2>/dev/null || echo "N/A")
          echo "### Dependencies" >> $GITHUB_STEP_SUMMARY
          echo "- Production: $DEPS" >> $GITHUB_STEP_SUMMARY
          echo "- Development: $DEV_DEPS" >> $GITHUB_STEP_SUMMARY
