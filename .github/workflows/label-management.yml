name: '🏷️ Label Management - JurisLab'

on:
  issues:
    types: [opened, edited]
  pull_request:
    types: [opened, edited, synchronize]
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'sync-labels'
        type: choice
        options:
          - sync-labels
          - cleanup
          - analytics

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  # ============================================
  # 🏷️ Auto-Label Issues
  # ============================================
  label-issues:
    name: '🏷️ Auto-Label Issues'
    runs-on: ubuntu-latest
    if: github.event_name == 'issues'
    steps:
      - name: Auto-categorize issue
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const title = issue.title.toLowerCase();
            const body = (issue.body || '').toLowerCase();
            const content = title + ' ' + body;
            const labelsToAdd = [];

            // Type detection
            if (content.includes('bug') || content.includes('erro') || content.includes('falha') || content.includes('quebr')) {
              labelsToAdd.push('bug');
            }
            if (content.includes('feature') || content.includes('funcionalidade') || content.includes('nova') || content.includes('adicionar')) {
              labelsToAdd.push('enhancement');
            }
            if (content.includes('security') || content.includes('segurança') || content.includes('vulnerabilidade') || content.includes('cve')) {
              labelsToAdd.push('security');
            }
            if (content.includes('performance') || content.includes('lento') || content.includes('otimiz')) {
              labelsToAdd.push('performance');
            }
            if (content.includes('docs') || content.includes('documentação') || content.includes('readme')) {
              labelsToAdd.push('documentation');
            }
            if (content.includes('ui') || content.includes('interface') || content.includes('design') || content.includes('css') || content.includes('visual')) {
              labelsToAdd.push('ui/ux');
            }

            // Area detection
            if (content.includes('contrato') || content.includes('contract') || content.includes('clt')) {
              labelsToAdd.push('area:contracts');
            }
            if (content.includes('decisão') || content.includes('decision') || content.includes('jurisprudência')) {
              labelsToAdd.push('area:decisions');
            }
            if (content.includes('api') || content.includes('endpoint') || content.includes('backend')) {
              labelsToAdd.push('area:backend');
            }
            if (content.includes('dashboard') || content.includes('painel') || content.includes('frontend')) {
              labelsToAdd.push('area:frontend');
            }
            if (content.includes('ia') || content.includes('ai') || content.includes('inteligência artificial') || content.includes('openai') || content.includes('anthropic')) {
              labelsToAdd.push('area:ai');
            }
            if (content.includes('prisma') || content.includes('database') || content.includes('banco de dados') || content.includes('migration')) {
              labelsToAdd.push('area:database');
            }
            if (content.includes('auth') || content.includes('login') || content.includes('autenticação') || content.includes('permiss')) {
              labelsToAdd.push('area:auth');
            }

            // Priority detection
            if (content.includes('urgente') || content.includes('critical') || content.includes('crítico') || content.includes('produção down')) {
              labelsToAdd.push('priority:critical');
            } else if (content.includes('important') || content.includes('importante') || content.includes('alta prioridade')) {
              labelsToAdd.push('priority:high');
            }

            if (labelsToAdd.length > 0) {
              // Ensure labels exist
              for (const label of labelsToAdd) {
                try {
                  await github.rest.issues.getLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: label
                  });
                } catch {
                  const colors = {
                    'bug': 'd73a4a',
                    'enhancement': 'a2eeef',
                    'security': 'e11d48',
                    'performance': 'fbca04',
                    'documentation': '0075ca',
                    'ui/ux': '7057ff',
                    'area:contracts': 'bfd4f2',
                    'area:decisions': 'c5def5',
                    'area:backend': '0e8a16',
                    'area:frontend': '1d76db',
                    'area:ai': 'f9d0c4',
                    'area:database': 'fef2c0',
                    'area:auth': 'b60205',
                    'priority:critical': 'b60205',
                    'priority:high': 'ff9500'
                  };
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: label,
                    color: colors[label] || 'ededed'
                  });
                }
              }

              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: labelsToAdd
              });

              console.log(`Added labels: ${labelsToAdd.join(', ')}`);
            }

  # ============================================
  # 🏷️ Auto-Label PRs
  # ============================================
  label-prs:
    name: '🏷️ Auto-Label PRs'
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Auto-categorize PR
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const labelsToAdd = [];

            // Get changed files
            const files = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number
            });

            const filePaths = files.data.map(f => f.filename);
            const extensions = filePaths.map(f => f.split('.').pop());

            // Size labels
            const additions = pr.additions || 0;
            const deletions = pr.deletions || 0;
            const totalChanges = additions + deletions;

            if (totalChanges <= 10) labelsToAdd.push('size:xs');
            else if (totalChanges <= 50) labelsToAdd.push('size:s');
            else if (totalChanges <= 200) labelsToAdd.push('size:m');
            else if (totalChanges <= 500) labelsToAdd.push('size:l');
            else labelsToAdd.push('size:xl');

            // Area labels based on files
            if (filePaths.some(f => f.startsWith('app/api/') || f.startsWith('actions/'))) labelsToAdd.push('area:backend');
            if (filePaths.some(f => f.startsWith('components/') || f.startsWith('app/dashboard/'))) labelsToAdd.push('area:frontend');
            if (filePaths.some(f => f.startsWith('prisma/'))) labelsToAdd.push('area:database');
            if (filePaths.some(f => f.includes('auth') || f.includes('middleware'))) labelsToAdd.push('area:auth');
            if (filePaths.some(f => f.includes('ai-service') || f.includes('insights'))) labelsToAdd.push('area:ai');
            if (filePaths.some(f => f.startsWith('.github/'))) labelsToAdd.push('devops');
            if (filePaths.some(f => f.endsWith('.md'))) labelsToAdd.push('documentation');
            if (filePaths.some(f => f.includes('test') || f.includes('spec'))) labelsToAdd.push('tests');

            // Security review flag
            const securityFiles = filePaths.filter(f => 
              f.includes('auth') || f.includes('middleware') || f.includes('permission') || 
              f.includes('prisma/schema') || f.includes('lib/prisma')
            );
            if (securityFiles.length > 0) {
              labelsToAdd.push('needs:security-review');
            }

            if (labelsToAdd.length > 0) {
              for (const label of labelsToAdd) {
                try {
                  await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name: label });
                } catch {
                  const colors = {
                    'size:xs': 'ededed', 'size:s': 'c5def5', 'size:m': '0075ca',
                    'size:l': 'fbca04', 'size:xl': 'd73a4a',
                    'area:backend': '0e8a16', 'area:frontend': '1d76db',
                    'area:database': 'fef2c0', 'area:auth': 'b60205',
                    'area:ai': 'f9d0c4', 'devops': '333333',
                    'documentation': '0075ca', 'tests': 'bfd4f2',
                    'needs:security-review': 'e11d48'
                  };
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner, repo: context.repo.repo,
                    name: label, color: colors[label] || 'ededed'
                  });
                }
              }

              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: labelsToAdd
              });
            }

  # ============================================
  # 🔄 Sync Labels
  # ============================================
  sync-labels:
    name: '🔄 Sync Labels'
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'sync-labels'
    steps:
      - name: Create standard labels
        uses: actions/github-script@v7
        with:
          script: |
            const standardLabels = [
              // Type
              { name: 'bug', color: 'd73a4a', description: 'Something is not working' },
              { name: 'enhancement', color: 'a2eeef', description: 'New feature or request' },
              { name: 'security', color: 'e11d48', description: 'Security related' },
              { name: 'performance', color: 'fbca04', description: 'Performance improvement' },
              { name: 'documentation', color: '0075ca', description: 'Documentation updates' },
              { name: 'ui/ux', color: '7057ff', description: 'UI/UX improvements' },
              { name: 'devops', color: '333333', description: 'DevOps and infrastructure' },
              { name: 'tests', color: 'bfd4f2', description: 'Test coverage' },
              
              // Priority
              { name: 'priority:critical', color: 'b60205', description: 'Critical priority' },
              { name: 'priority:high', color: 'ff9500', description: 'High priority' },
              { name: 'priority:medium', color: 'fbca04', description: 'Medium priority' },
              { name: 'priority:low', color: '0e8a16', description: 'Low priority' },
              
              // Area
              { name: 'area:contracts', color: 'bfd4f2', description: 'Labor contracts module' },
              { name: 'area:decisions', color: 'c5def5', description: 'Judicial decisions module' },
              { name: 'area:backend', color: '0e8a16', description: 'Backend/API changes' },
              { name: 'area:frontend', color: '1d76db', description: 'Frontend/UI changes' },
              { name: 'area:ai', color: 'f9d0c4', description: 'AI/ML features' },
              { name: 'area:database', color: 'fef2c0', description: 'Database changes' },
              { name: 'area:auth', color: 'b60205', description: 'Authentication/Authorization' },
              
              // Size
              { name: 'size:xs', color: 'ededed', description: 'Extra small change (≤10 lines)' },
              { name: 'size:s', color: 'c5def5', description: 'Small change (≤50 lines)' },
              { name: 'size:m', color: '0075ca', description: 'Medium change (≤200 lines)' },
              { name: 'size:l', color: 'fbca04', description: 'Large change (≤500 lines)' },
              { name: 'size:xl', color: 'd73a4a', description: 'Extra large change (>500 lines)' },
              
              // Status
              { name: 'needs:security-review', color: 'e11d48', description: 'Requires security review' },
              { name: 'needs:review', color: 'fbca04', description: 'Needs code review' },
              { name: 'needs:testing', color: '0075ca', description: 'Needs testing' },
              { name: 'blocked', color: 'd73a4a', description: 'Blocked by dependency' },
              { name: 'wontfix', color: 'ffffff', description: 'Will not be fixed' },
              { name: 'duplicate', color: 'cfd3d7', description: 'Duplicate issue' },
              
              // Automation
              { name: 'automated', color: '333333', description: 'Created by automation' },
              { name: 'cto-dashboard', color: '5319e7', description: 'CTO Dashboard reports' },
              { name: 'report', color: '006b75', description: 'Automated report' }
            ];

            let created = 0;
            let updated = 0;

            for (const label of standardLabels) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name
                });
                // Label exists, update it
                await github.rest.issues.updateLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                  color: label.color,
                  description: label.description
                });
                updated++;
              } catch {
                // Label doesn't exist, create it
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                  color: label.color,
                  description: label.description
                });
                created++;
              }
            }

            core.summary.addRaw(`## 🏷️ Label Sync Complete\n\n- Created: ${created}\n- Updated: ${updated}\n- Total: ${standardLabels.length}`);
            await core.summary.write();
