name: '🚀 CI/CD Pipeline - JurisLab'

on:
  push:
    branches: [main, staging, develop]
  pull_request:
    branches: [main, staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '18'
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  # ============================================
  # 🔍 Code Quality & Linting
  # ============================================
  quality:
    name: '🔍 Code Quality'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run check

      - name: Lint check
        run: npx next lint
        continue-on-error: true

  # ============================================
  # 🧪 Testing
  # ============================================
  test:
    name: '🧪 Tests'
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run tests
        run: npx jest --ci --coverage --passWithNoTests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ============================================
  # 🛡️ Security Scanning
  # ============================================
  security:
    name: '🛡️ Security Scan'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Check for known vulnerabilities
        run: npx audit-ci --high
        continue-on-error: true

  # ============================================
  # 🏗️ Build
  # ============================================
  build:
    name: '🏗️ Build'
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build application
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: .next/
          retention-days: 3

  # ============================================
  # 🚀 Deploy Staging
  # ============================================
  deploy-staging:
    name: '🚀 Deploy Staging'
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: .next/

      - name: Deploy to Staging
        run: |
          echo "🚀 Deploying to staging environment..."
          echo "Add your staging deployment commands here"
          # Example: npx vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}

      - name: Notify deployment
        if: always()
        run: |
          echo "📊 Staging deployment status: ${{ job.status }}"

  # ============================================
  # 🚀 Deploy Production
  # ============================================
  deploy-production:
    name: '🚀 Deploy Production'
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: .next/

      - name: Deploy to Production
        run: |
          echo "🚀 Deploying to production environment..."
          echo "Add your production deployment commands here"
          # Example: npx vercel deploy --prod --prebuilt --token=${{ secrets.VERCEL_TOKEN }}

      - name: Verify deployment health
        run: |
          echo "🔍 Verifying deployment health..."
          # Add health check curl command here

      - name: Notify deployment
        if: always()
        run: |
          echo "📊 Production deployment status: ${{ job.status }}"
